#---------------------------------------------------#
mode: rule
log-level: error
ipv6: false
#自定义 geodata url
geox-url:
  geoip: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.metadb"
geo-auto-update: false # 是否自动更新 geodata
geo-update-interval: 24 # 更新间隔，单位：小时
listeners:
  - name: mixed-in
    type: mixed
    port: 7890
    listen: 0.0.0.0
    udp: true
dns:
  enable: true
  prefer-h3: true
  use-hosts: true
  use-system-hosts: true
  respect-rules: false
  listen: 0.0.0.0:1053
  default-nameserver:
    - 223.5.5.5
  direct-nameserver:
    - 223.5.5.5
  # proxy-server-nameserver:
  #   - https://doh.pub/dns-query
  nameserver-policy:
    "+.iyunquna.com,+.yqn.corp": 192.168.150.129
    "+.guosuyu.live,+.guosuyu.top,+.f2d.top": https://dns.alidns.com/dns-query
    "geosite:cn,private,apple": https://dns.alidns.com/dns-query
    "geosite:geolocation-!cn": https://doh.pub/dns-query
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
proxies:
  - name: v-vmess
    type: vmess
    server: proxy.guosuyu.live
    port: 8599
    uuid: 9d875f49-ec70-41ad-b9e9-c546543eedbb
    alterId: 0
    cipher: auto
    packet-encoding: packetaddr
    global-padding: false
    authenticated-length: false
    udp: true
    tls: true
    servername: www.bing.com
    # fingerprint: xxxx
    # client-fingerprint: chrome    # Available: "chrome","firefox","safari","ios","random", currently only support TLS transport in TCP/GRPC/WS/HTTP for VLESS/Vmess and trojan.
    skip-cert-verify: true
    # servername: example.com # priority over wss host
    # network: grpc
    network: ws
    # grpc-opts:
    #   grpc-service-name: www.bing.com
    ws-opts:
      path: /welcome
      headers:
        Host: www.bing.com
      max-early-data: 2048
      early-data-header-name: Sec-WebSocket-Protocol
      v2ray-http-upgrade: false
      v2ray-http-upgrade-fast-open: false
  - name: v-tuic
    server: 54.189.247.11
    port: 8500
    type: tuic
    uuid: c5e33311-3bf3-411a-8844-aa2570a9d8a4
    password: d192f18c
    # reduce-rtt: false
    # request-timeout: 8000
    # udp-relay-mode: native # Available: "native", "quic". Default: "native"
    congestion-controller: bbr # Available: "cubic", "new_reno", "bbr". Default: "cubic"
    # cwnd: 10 # default: 32
    # max-udp-relay-packet-size: 1500
    # fast-open: true
    # max-open-streams: 20 # default 100, too many open streams may hurt performance
    tls: true
    sni: www.bing.com
    servername: www.bing.com
    alpn:
      - h3
    skip-cert-verify: true
    version: 5
# - name: dns-out
#   type: dns

proxy-groups:
  - name: 自动选择
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 10
    tolerance: 50
    proxies:
      - v-tuic
      - v-vmess
  - name: 节点选择
    type: select
    proxies:
      - 自动选择
      - DIRECT
      - v-tuic
      - v-vmess
# proxy-providers:

rule-providers:
